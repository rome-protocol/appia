name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hermetic — every PR. Proves it compiles + the unit logic holds. No secrets,
  # no network, no funds, so it stays green out of the box for a fork.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Validate the image builds (no push, no secrets). The deployable build runs
  # elsewhere; this keeps the repo self-buildable and catches Dockerfile breaks.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate image builds (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=appia-validate
          cache-to: type=gha,mode=min,scope=appia-validate
